name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Evaluation
        run: npm run test:eval
        env:
          CALLGUARD_EVAL_REPORT: ${{ runner.temp }}/callguard-eval.md
      - name: Upload PR evaluation
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: callguard-eval
          path: ${{ runner.temp }}/callguard-eval.md
          if-no-files-found: ignore
      - name: Build
        run: npm run build

  classifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: training/requirements.txt
      - name: Install training requirements
        run: python -m pip install -r training/requirements.txt
      - name: Retrain and verify classifier exports
        run: |
          python training/train.py --output-root "$RUNNER_TEMP/callguard-classifier"
          python training/check_exports.py "$RUNNER_TEMP/callguard-classifier"
